# VIBE 后端配置模板
# 使用方式：复制为 config/config.yaml 后按环境填写
server:
  port: 8080
  mode: debug          # debug / release

mysql:
  host: 127.0.0.1
  port: 3306
  user: vibe
  dbname: vibe
  # 数据库密码密文（AES-256-GCM），由 cmd/encrypt 工具生成：
  #   go run ./cmd/encrypt -plaintext '你的数据库密码'
  # 解密密钥通过环境变量 VIBE_DB_KEY（64 位十六进制）注入，禁止写在配置中
  password_cipher: ""
  max_open_conns: 20
  max_idle_conns: 5

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

rabbitmq:
  url: amqp://guest:guest@127.0.0.1:5672/

jwt:
  # 通过环境变量 VIBE_JWT_SECRET 注入（≥ 32 字节随机串），此处仅作占位
  secret_env: VIBE_JWT_SECRET
  access_ttl_minutes: 15
  refresh_ttl_days: 7

security:
  # 登录失败锁定（FR-20）：默认关闭，确认启用后改为 true
  enable_login_lock: false
  max_login_failures: 5
  lock_minutes: 15
  api_rate_limit_per_minute: 120

cors:
  allowed_origins:
    - http://localhost:5173

logger:
  level: debug

reminder:
  scan_interval_seconds: 60
  window_seconds: 60
  compensation_batch: 50
